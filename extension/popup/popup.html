<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <header>
      <h1>OffMic</h1>
      <div class="header-tools">
        <span id="dot" class="dot"></span>
        <button id="settingsBtn" class="icon-button" data-i18n-title="settingsTitle" title="Settings">
          <svg viewBox="0 0 24 24" width="16" height="16" aria-hidden="true">
            <path
              fill="currentColor"
              d="M19.14 12.94a7.07 7.07 0 0 0 0-1.88l2.03-1.58a.5.5 0 0 0 .12-.64l-1.92-3.32a.5.5 0 0 0-.6-.22l-2.39.96a7.3 7.3 0 0 0-1.63-.94l-.36-2.54a.5.5 0 0 0-.5-.42h-3.84a.5.5 0 0 0-.5.42l-.36 2.54c-.58.24-1.13.55-1.63.94l-2.39-.96a.5.5 0 0 0-.6.22L2.65 8.84a.5.5 0 0 0 .12.64l2.03 1.58a7.07 7.07 0 0 0 0 1.88l-2.03 1.58a.5.5 0 0 0-.12.64l1.92 3.32c.13.22.39.31.6.22l2.39-.96c.5.39 1.05.7 1.63.94l.36 2.54c.04.24.25.42.5.42h3.84c.25 0 .46-.18.5-.42l.36-2.54c.58-.24 1.13-.55 1.63-.94l2.39.96c.22.09.47 0 .6-.22l1.92-3.32a.5.5 0 0 0-.12-.64ZM12 15.6A3.6 3.6 0 1 1 12 8.4a3.6 3.6 0 0 1 0 7.2Z"
            />
          </svg>
        </button>
      </div>
    </header>

    <section id="settings" hidden>
      <label>
        <span data-i18n="labelLanguage">Language</span>
        <select id="language">
          <option value="auto" data-i18n="languageAuto">Automatic (browser language)</option>
          <option value="en">English</option>
          <option value="fr">Français</option>
          <option value="nl">Nederlands</option>
          <option value="de">Deutsch</option>
          <option value="es">Español</option>
        </select>
      </label>
      <label>
        <span data-i18n="labelTheme">Appearance</span>
        <select id="theme">
          <option value="auto" data-i18n="themeAuto">Automatic (browser theme)</option>
          <option value="light" data-i18n="themeLight">Light</option>
          <option value="dark" data-i18n="themeDark">Dark</option>
        </select>
      </label>
      <label>
        <span data-i18n="labelMicDevice">Microphone</span>
        <select id="micDevice"></select>
      </label>
      <label>
        <span data-i18n="labelSpeakerDevice">Audio output</span>
        <select id="speakerDevice"></select>
      </label>
      <label>
        <span class="range-head">
          <span data-i18n="labelMicVolume">Microphone volume</span>
          <span id="micVolumeValue" class="range-value">100%</span>
        </span>
        <input id="micVolume" type="range" min="0" max="100" step="1" value="100" />
      </label>
      <label>
        <span class="range-head">
          <span data-i18n="labelTeamVolume">Team volume</span>
          <span id="teamVolumeValue" class="range-value">100%</span>
        </span>
        <input id="teamVolume" type="range" min="0" max="100" step="1" value="100" />
      </label>
      <p id="deviceHint" class="hint" data-i18n="hintDevices" hidden>
        Grant microphone access to list your audio devices.
      </p>
      <button id="deviceGrantBtn" class="secondary" data-i18n="btnGrantMic" hidden>
        Grant microphone access
      </button>
    </section>

    <section id="setup">
      <label>
        <span data-i18n="labelServer">Server</span>
        <input id="serverUrl" type="text" placeholder="wss://offmic.xeron.be" />
      </label>
      <label>
        <span data-i18n="labelTeamCode">Team code</span>
        <input id="room" type="text" placeholder="team-alpha" />
      </label>
      <label>
        <span data-i18n="labelName">Name</span>
        <input id="name" type="text" data-i18n-placeholder="placeholderName" placeholder="Your name" />
      </label>
    </section>

    <section id="controls">
      <label class="switch">
        <input id="listen" type="checkbox" checked />
        <span data-i18n="listenLabel">Listen to the team even when the Teams mic is live</span>
      </label>
      <button id="connectBtn" data-i18n="btnConnect">Connect</button>
      <button id="disconnectBtn" class="secondary" data-i18n="btnDisconnect" hidden>Disconnect</button>
    </section>

    <section id="status">
      <p id="stateLine" class="muted" data-i18n="stateDisconnected">Disconnected.</p>
      <p id="errorLine" class="error" hidden></p>
      <button id="grantBtn" class="secondary" data-i18n="btnGrantMic" hidden>Grant microphone access</button>
      <p id="talkLine"></p>
      <ul id="peers">
        <li id="peersEmpty" class="muted" data-i18n="noPeers" hidden>No teammate connected.</li>
      </ul>
    </section>

    <template id="peerTemplate">
      <li class="peer">
        <div class="peer-head">
          <span class="peer-label"></span>
          <span class="peer-actions">
            <button class="icon-button peer-mute" type="button">
              <svg viewBox="0 0 24 24" width="16" height="16" aria-hidden="true">
                <path
                  fill="currentColor"
                  d="M12 14a3 3 0 0 0 3-3V5a3 3 0 0 0-6 0v6a3 3 0 0 0 3 3Zm7-3a7 7 0 0 1-6 6.92V21h-2v-3.08A7 7 0 0 1 5 11h2a5 5 0 0 0 10 0h2Z"
                />
                <path
                  class="mic-slash"
                  stroke="currentColor"
                  stroke-width="2"
                  stroke-linecap="round"
                  fill="none"
                  d="M4.5 4.5 19.5 19.5"
                />
              </svg>
            </button>
            <button class="icon-button peer-volume-toggle" type="button">
              <svg viewBox="0 0 24 24" width="16" height="16" aria-hidden="true">
                <path
                  fill="currentColor"
                  d="M3 9v6h4l5 5V4L7 9H3Zm13.5 3A4.5 4.5 0 0 0 14 7.97v8.05A4.47 4.47 0 0 0 16.5 12ZM14 3.23v2.06a6.99 6.99 0 0 1 0 13.42v2.06a9 9 0 0 0 0-17.54Z"
                />
              </svg>
            </button>
          </span>
        </div>
        <div class="peer-volume-row" hidden>
          <input class="peer-volume" type="range" min="0" max="100" step="1" value="100" />
          <span class="peer-volume-value">100%</span>
        </div>
      </li>
    </template>

    <p class="hint" data-i18n="hintHeadset">Tip: wear a headset to avoid any leak to the client.</p>

    <script src="../compat.js"></script>
    <script src="../config.js"></script>
    <script src="../theme.js"></script>
    <script src="../i18n.js"></script>
    <script src="popup.js"></script>
  </body>
</html>
